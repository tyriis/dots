[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
env_shell_expand = true

[settings.node]
# compile = true
gpg_verify = false

[tools]
"npm:pnpm" = "11.17.0"
"aqua:direnv/direnv" = "2.37.1"
"aqua:derailed/k9s" = "0.51.0"
"aqua:kubernetes/kubernetes/kubectl" = "1.36.3"
"aqua:go-task/task" = "3.52.0"
"aqua:jdx/usage" = "4.0.0"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:jqlang/jq" = "1.8.2"
"aqua:minio/mc" = "RELEASE.2025-08-13T08-35-41Z"
"github:openbao/openbao" = "2.6.1"
"aqua:cli/cli" = "2.96.0"
"github:jdx/fnox" = "1.31.1"
"aqua:anomalyco/opencode" = "1.18.7"
"aqua:junegunn/fzf" = "0.74.1"
"aqua:tmux/tmux-builds" = "3.7b"
node = "26.5.0"
helm = "4.2.3"

[env]
OBSIDIAN_VAULT_PATH = "$HOME/documents/obsidian"
XKB_DEFAULT_VARIANT = "nodeadkeys"
OPENCODE_ENABLE_TELEMETRY = "1"
OPENCODE_OTLP_ENDPOINT = "https://otlp-gateway-prod-us-central-0.grafana.net/otlp"
OPENCODE_OTLP_PROTOCOL = "http/protobuf"
OPENCODE_OTLP_HEADERS_HELPER = "$HOME/.local/bin/grafana-cloud-otlp-header.sh"
OPENCODE_RESOURCE_ATTRIBUTES = "service.name=tyriis"
VAULT_ADDR = "https://secrets.techtales.io"
